[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ideaforge"
version = "0.1.0"
description = "Traceable prototype-dossier tooling for IDEAForge"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
documents = ["PyMuPDF>=1.24", "python-docx>=1.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
ideaforge = "ideaforge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
